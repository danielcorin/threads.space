name: Distribution artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run api:contract:check
      - name: Archive contract
        shell: bash
        run: |
          version="$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="$GITHUB_REF_NAME"; fi
          tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner \
            -czf "dist/threads-api-contract-${version}.tar.gz" \
            -C dist/api-contract .
      - name: Upload contract
        uses: actions/upload-artifact@v7
        with:
          name: threads-api-contract-${{ github.sha }}
          path: dist/threads-api-contract-*.tar.gz
          if-no-files-found: error

  cli:
    name: CLI / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            filename: threads-linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            filename: threads-linux-arm64
          - target: darwin-x64
            runner: macos-15-intel
            filename: threads-darwin-x64
          - target: darwin-arm64
            runner: macos-15
            filename: threads-darwin-arm64
          - target: windows-x64
            runner: windows-2025
            filename: threads-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --prefix agent-tools/cli run check
      - name: Build native executable
        run: npm run cli:artifacts:build -- --target ${{ matrix.target }}
      - name: Attest native executable
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: agent-tools/cli/dist/cli/${{ matrix.filename }}
      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: threads-cli-${{ matrix.target }}-${{ github.sha }}
          path: agent-tools/cli/dist/cli/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Publish unified release
    if: github.ref_type == 'tag'
    needs: [contract, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-tools/bridge/go.mod
          cache-dependency-path: agent-tools/bridge/go.sum
      - name: Validate coordinated release version
        run: |
          package_version=$(jq -r .version agent-tools/package.json)
          cli_version=$(jq -r .version agent-tools/cli/package.json)
          discovery_version=$(jq -r .version agent-tools/release.json)
          test "$GITHUB_REF_NAME" = "v${package_version}"
          test "$GITHUB_REF_NAME" = "v${cli_version}"
          test "$GITHUB_REF_NAME" = "$discovery_version"
      - uses: actions/download-artifact@v4
        with:
          name: threads-api-contract-${{ github.sha }}
          path: dist/contract
      - uses: actions/download-artifact@v4
        with:
          pattern: threads-cli-*-${{ github.sha }}
          path: dist/cli
          merge-multiple: true
      - name: Create CLI and contract manifests
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cp agent-tools/contracts/threads.json dist/cli/threads-openapi.json
          cp agent-tools/contracts/ws-events.yaml dist/cli/threads-ws-events.yaml
          cd dist/cli
          sha256sum threads-darwin-* threads-linux-* threads-windows-* > THREADS_CLI_SHA256SUMS
          sha256sum threads-openapi.json threads-ws-events.yaml > THREADS_CONTRACT_SHA256SUMS
          files=$(jq -Rn '
            [inputs
              | capture("^(?<sha256>[0-9a-f]+)  (?<file>.+)$")
              | {file, sha256}]
          ' < THREADS_CLI_SHA256SUMS)
          contracts=$(jq -Rn '
            [inputs
              | capture("^(?<sha256>[0-9a-f]+)  (?<file>.+)$")
              | {file, sha256}]
          ' < THREADS_CONTRACT_SHA256SUMS)
          generated_at=$(git show -s --format=%cI "$GITHUB_SHA")
          jq -n \
            --arg name threads-cli \
            --arg version "$VERSION" \
            --arg gitSha "$GITHUB_SHA" \
            --arg generatedAt "$generated_at" \
            --arg source "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/agent-tools" \
            --argjson files "$files" \
            --argjson contracts "$contracts" \
            '{name:$name,version:$version,gitSha:$gitSha,generatedAt:$generatedAt,source:$source,files:$files,contracts:$contracts}' \
            > threads-cli-manifest.json
      - name: Test and build bridge archives
        env:
          THREADS_CLI_DIR: ${{ github.workspace }}/dist/cli
          THREADS_BRIDGE_OUTPUT_DIR: ${{ github.workspace }}/dist/bridge
        run: |
          go -C agent-tools/bridge test ./...
          go -C agent-tools/bridge vet ./...
          agent-tools/bridge/scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Create unified manifest and archive checksum
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cli=$(jq -Rn '
            [inputs
              | capture("^(?<sha256>[0-9a-f]+)  (?<file>.+)$")
              | {file, sha256}]
          ' < dist/cli/THREADS_CLI_SHA256SUMS)
          contracts=$(jq -Rn '
            [inputs
              | capture("^(?<sha256>[0-9a-f]+)  (?<file>.+)$")
              | {file, sha256}]
          ' < dist/cli/THREADS_CONTRACT_SHA256SUMS)
          bridge=$(jq -Rn '
            [inputs
              | capture("^(?<sha256>[0-9a-f]+)  (?<file>.+)$")
              | {file, sha256}]
          ' < dist/bridge/THREADS_AGENT_BRIDGE_SHA256SUMS)
          generated_at=$(git show -s --format=%cI "$GITHUB_SHA")
          jq -n \
            --arg name threads-agent-tools \
            --arg version "$VERSION" \
            --arg gitSha "$GITHUB_SHA" \
            --arg generatedAt "$generated_at" \
            --arg source "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/agent-tools" \
            --argjson cli "$cli" \
            --argjson bridge "$bridge" \
            --argjson contracts "$contracts" \
            '{name:$name,version:$version,gitSha:$gitSha,generatedAt:$generatedAt,source:$source,cli:$cli,bridge:$bridge,contracts:$contracts}' \
            > dist/threads-agent-tools-manifest.json
          (
            cd dist/contract
            sha256sum threads-api-contract-*.tar.gz > THREADS_API_CONTRACT_ARCHIVE_SHA256SUMS
          )
      - name: Smoke test release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod 0755 dist/cli/threads-linux-x64
          dist/cli/threads-linux-x64 --help >/dev/null
          test "$(dist/cli/threads-linux-x64 --version)" = "threads ${VERSION}"
          (
            cd dist/cli
            sha256sum --check THREADS_CLI_SHA256SUMS
            sha256sum --check THREADS_CONTRACT_SHA256SUMS
          )
          (
            cd dist/bridge
            sha256sum --check THREADS_AGENT_BRIDGE_SHA256SUMS
          )
          (
            cd dist/contract
            sha256sum --check THREADS_API_CONTRACT_ARCHIVE_SHA256SUMS
          )
          tmp=$(mktemp -d)
          tar -xzf "dist/bridge/threads-agent-bridge_${VERSION}_linux_amd64.tar.gz" -C "$tmp"
          "$tmp/threads-agent-bridge_${VERSION}_linux_amd64/threads-agent-bridge" -h
          test "$("$tmp/threads-agent-bridge_${VERSION}_linux_amd64/threads" --version)" = "threads ${VERSION}"
          cmp "$tmp/threads-agent-bridge_${VERSION}_linux_amd64/threads" dist/cli/threads-linux-x64
      - name: Attest bridge archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/bridge/threads-agent-bridge_*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/contract/* \
            dist/cli/threads-darwin-* \
            dist/cli/threads-linux-* \
            dist/cli/threads-windows-* \
            dist/cli/threads-openapi.json \
            dist/cli/threads-ws-events.yaml \
            dist/cli/THREADS_CLI_SHA256SUMS \
            dist/cli/THREADS_CONTRACT_SHA256SUMS \
            dist/cli/threads-cli-manifest.json \
            dist/bridge/threads-agent-bridge_*.tar.gz \
            dist/bridge/THREADS_AGENT_BRIDGE_SHA256SUMS \
            dist/threads-agent-tools-manifest.json \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
